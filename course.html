<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Course access</title><link rel="stylesheet" href="/styles.css"></head><body><main><section class="hero"><p class="eyebrow">COURSE ACCESS</p><h1>Start with one workflow.</h1><p id="status" class="lede">Checking your course access...</p><div id="content" hidden><p>Module 1: choose a repeatable task. Module 2: map the agent workflow. Module 3: test with safe data. Module 4: launch with verification and fallback.</p><p>Complete the first successful run before expanding scope.</p></div></section></main><script>const params = new URLSearchParams(location.search); fetch('/api/course-access?email=' + encodeURIComponent(params.get('email') || '') + '&token=' + encodeURIComponent(params.get('token') || '')).then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.error); document.querySelector('#status').textContent = 'Access confirmed for ' + data.product + '.'; document.querySelector('#content').hidden = false; }).catch(error => { document.querySelector('#status').textContent = error.message; });</script></body></html>
